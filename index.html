<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#885c3b"><title>Zara’s Little Library</title><style>
:root{--brown:#6c452f;--ink:#533825;--cream:#fff5df}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#805436;color:var(--ink);font-family:Georgia,'Times New Roman',serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #5386a3;outline-offset:3px}.hide{display:none!important}.home{width:min(100%,1536px);margin:auto;position:relative}.home>img{width:100%;height:auto;display:block}.hotspot{position:absolute;top:10.4%;height:35%;background:transparent;border:0;border-radius:12px}.hotspot:focus-visible{background:#ffffff38}.hotspot.one{left:20.3%;width:19.8%}.hotspot.two{left:42.2%;width:19.4%}.hotspot.three{left:64%;width:19.8%}.home-note{position:absolute;bottom:1%;right:2%;font-size:clamp(9px,1vw,13px);color:#755b42;background:#fff6e6b8;padding:4px 8px;border-radius:8px}.reader{min-height:100dvh;background:radial-gradient(ellipse at center,#a77b54,#74472f);padding:clamp(8px,1.4vw,22px)}.reader-header{max-width:1450px;margin:auto auto 12px;display:grid;grid-template-columns:1fr 3fr 1fr;align-items:center;gap:8px;color:#fff0d2;text-align:center}.reader-header h1{font-weight:normal;font-size:clamp(20px,3vw,40px);margin:0}.reader-header small{font-size:clamp(13px,1.5vw,19px)}.pill{border:1px solid #bc9875;border-radius:30px;background:#f9ebce;color:#62432e;padding:12px 18px;box-shadow:0 2px 2px #3c25191c}.reader-header .pill:first-child{justify-self:start}.reader-header .pill:last-child{justify-self:end}.book{max-width:1450px;margin:auto;position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:min(70vw,740px);background:linear-gradient(90deg,#fff6e5 0%,#fef1d9 47%,#d5b48b 49.8%,#b99167 50%,#f6e7c9 50.4%,#fff6e5 100%);border:14px solid #805038;border-bottom-width:20px;border-radius:42px 42px 24px 24px;box-shadow:0 12px 0 #5d3627,0 22px 30px #3c2219a0,inset 0 0 35px #be946f80;overflow:hidden}.page{position:relative;min-width:0;padding:clamp(20px,4vw,64px);display:flex;flex-direction:column;justify-content:center;align-items:center}.left{border-right:1px solid #d7b78c55}.page::after{content:'❀  ❁  ❀';position:absolute;bottom:16px;left:24px;color:#8da084;font-size:clamp(16px,2vw,30px);opacity:.7;letter-spacing:9px;pointer-events:none}.right::after{left:auto;right:18px}.corner{position:absolute;top:12px;left:22px;color:#9da987;font-size:30px;opacity:.65}.corner.r{left:auto;right:22px}.text-panel{width:100%;max-width:560px;background:#fff9ed9c;border:1px solid #e9d7b860;border-radius:20px;padding:clamp(16px,3vw,36px);box-shadow:0 2px 20px #c4a58124}.sentence{font-size:clamp(25px,3.2vw,49px);line-height:1.55;text-align:center;min-height:3.2em;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;align-content:center;column-gap:.25em}.sentence.large{font-size:clamp(32px,4vw,62px)}.word{border-radius:5px;padding:0 .035em}.word.active{background:#d2dcbf;box-shadow:0 4px #74918a}.slider{width:100%;margin:22px 0 6px;accent-color:#8ba6ac;touch-action:pan-y}.slider-label{text-align:right;font-size:clamp(13px,1.5vw,19px);color:#83654a}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:20px}.controls .pill{font-size:clamp(13px,1.4vw,18px);padding:10px 14px}.picture{max-width:100%;width:min(100%,490px);height:clamp(260px,40vw,590px);object-fit:contain;filter:drop-shadow(0 4px 6px #6c51312e)}.picture-shell{width:100%;display:flex;align-items:center;justify-content:center;min-height:clamp(260px,40vw,590px)}.placeholder{width:min(100%,490px);height:clamp(260px,40vw,590px);display:flex;justify-content:center;align-items:center;text-align:center;color:#b8a07f;background:radial-gradient(ellipse,#eadbc38c,#fff7e400);font-size:clamp(80px,12vw,180px);opacity:.65}.reveal{margin-top:10px;z-index:1}.nav{max-width:1450px;margin:22px auto;display:flex;justify-content:space-between;gap:12px}.nav .pill{min-width:130px}.nav .pill:disabled{opacity:.42;cursor:default}.small-note{max-width:1450px;margin:0 auto;color:#f7e9d2;text-align:center;font-size:13px}.fade{animation:appear .25s ease-out}@keyframes appear{from{opacity:.3;transform:scale(.985)}to{opacity:1;transform:scale(1)}}@media(max-width:680px){.book{min-height:0;grid-template-columns:1fr;border-width:8px;border-bottom-width:12px;border-radius:24px}.page{min-height:300px;padding:30px 22px 44px}.left{border-right:0;border-bottom:1px solid #d8bc96}.sentence{min-height:2.3em}.picture-shell,.picture,.placeholder{height:320px}.reader-header{grid-template-columns:auto 1fr auto}.reader-header h1{font-size:19px}.reader-header .pill{padding:8px;font-size:12px}.nav{margin:14px auto}.nav .pill{min-width:0}.home-note{display:none}}@media(prefers-reduced-motion:reduce){.fade{animation:none}}
</style></head><body><main id="home" class="home"><img src="assets/approved-landing.jpg" alt="Zara's Little Library: vintage illustrated bookshelf with Kit, Sara, and Sam, and a welcome storybook"><button class="hotspot one" aria-label="Open Kit and the Red Hat" data-book="kit"></button><button class="hotspot two" aria-label="Open Sara and the Big Egg" data-book="sara"></button><button class="hotspot three" aria-label="Open Sam’s Fun Trip" data-book="sam"></button></main><main id="reader" class="reader hide"><header class="reader-header"><button class="pill" id="back">‹ Bookshelf</button><div><h1 id="title"></h1><small id="count"></small></div><button class="pill" id="restart">↻ Start</button></header><section class="book" aria-label="Open storybook"><div class="page left"><span class="corner" aria-hidden="true">❧</span><div class="text-panel"><div class="sentence" id="sentence" aria-live="polite"></div><input class="slider" id="slider" type="range" min="0" max="100" value="0" aria-label="Slide to highlight words as you read"><div class="slider-label">Slide to read →</div><div class="controls"><button class="pill" id="font">A+ Larger text</button><button class="pill" id="again">↺ Start again</button></div></div></div><div class="page right"><span class="corner r" aria-hidden="true">❧</span><div class="picture-shell" id="picture-shell"><div class="placeholder" id="placeholder" aria-hidden="true">✿</div><img class="picture hide" id="picture" alt=""></div><button class="pill reveal" id="reveal">◉ Reveal picture</button></div></section><nav class="nav"><button class="pill" id="prev">‹ Previous</button><button class="pill" id="next">Next ›</button></nav><p class="small-note">Pictures are hidden until you choose to reveal them. Each page has its own illustration.</p></main><script>
const fallback={books:[{id:'kit',title:'Kit and the Red Hat',pages:[{text:'Kit is a cat.',image:'assets/01-kit-is-a-cat.png'},{text:'Kit has a red hat.',image:'assets/02-kit-has-a-red-hat.png'},{text:'A big gust of wind hits the hat.',image:'assets/03-a-big-gust-of-wind.png'},{text:'The hat lands in the mud.',image:'assets/04-hat-lands-in-mud.png'},{text:'Kit is sad. The hat is wet.',image:'assets/05-kit-is-sad.png'},{text:'Pip can help get the hat.',image:'assets/06-pip-gets-the-hat.png'},{text:'The hat will dry in the sun.',image:'assets/07-hat-dries-in-sun.png'},{text:'Kit is glad for Pip’s help.',image:'assets/08-kit-thanks-pip.png'}]}]};let library=fallback,book=null,page=0,revealed=false,large=false;const $=id=>document.getElementById(id);fetch('books.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>library=x).catch(()=>{});function home(){book=null;$('reader').classList.add('hide');$('home').classList.remove('hide');history.replaceState({},'',location.pathname)}function openBook(id){let b=library.books.find(x=>x.id===id);if(!b||!b.pages.length){alert('This story is coming soon!');return}book=b;page=0;large=false;$('sentence').classList.remove('large');$('font').textContent='A+ Larger text';$('home').classList.add('hide');$('reader').classList.remove('hide');history.replaceState({},'',location.pathname+'#'+id);render();scrollTo({top:0,behavior:'instant'})}function words(){return book.pages[page].text.match(/\S+/g)||[]}function highlight(){const list=[...$('sentence').querySelectorAll('.word')],progress=Number($('slider').value),active=progress===0?0:Math.min(list.length-1,Math.ceil(progress/100*list.length)-1);list.forEach((el,i)=>el.classList.toggle('active',i===active))}function render(){if(!book)return;revealed=false;$('title').textContent=book.title;$('count').textContent=`Page ${page+1} of ${book.pages.length}`;$('sentence').replaceChildren(...words().map((w,i)=>{let s=document.createElement('span');s.className='word';s.textContent=w;return s}));$('slider').value=0;highlight();$('picture').src=book.pages[page].image;$('picture').alt=`Watercolor illustration for: ${book.pages[page].text}`;$('picture').classList.add('hide');$('placeholder').classList.remove('hide');$('reveal').textContent='◉ Reveal picture';$('prev').disabled=page===0;$('next').disabled=page===book.pages.length-1;$('picture-shell').classList.remove('fade');void $('picture-shell').offsetWidth;$('picture-shell').classList.add('fade')}function togglePicture(){revealed=!revealed;$('picture').classList.toggle('hide',!revealed);$('placeholder').classList.toggle('hide',revealed);$('reveal').textContent=revealed?'◉ Hide picture':'◉ Reveal picture'}document.querySelectorAll('[data-book]').forEach(b=>b.addEventListener('click',()=>openBook(b.dataset.book)));$('back').onclick=home;$('restart').onclick=()=>{page=0;render()};$('again').onclick=()=>{$('slider').value=0;highlight()};$('font').onclick=()=>{large=!large;$('sentence').classList.toggle('large',large);$('font').textContent=large?'A− Smaller text':'A+ Larger text'};$('slider').oninput=highlight;$('reveal').onclick=togglePicture;$('prev').onclick=()=>{if(page>0){page--;render()}};$('next').onclick=()=>{if(page<book.pages.length-1){page++;render()}};document.addEventListener('keydown',e=>{if(!book||['INPUT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&page<book.pages.length-1){page++;render()}if(e.key==='ArrowLeft'&&page>0){page--;render()}});window.addEventListener('hashchange',()=>{if(!location.hash)home()});
</script></body></html>
