<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#9c724c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Zara’s Library"><link rel="manifest" href="manifest.webmanifest"><title>Zara's Little Library</title><style>
:root{--ink:#553720;--paper:#fff3d9}*{box-sizing:border-box}html{min-height:100%;background:#775035}body{margin:0;color:var(--ink);font-family:Georgia,'Times New Roman',serif}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #396c82;outline-offset:3px}.hidden{display:none!important}.app{min-height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 15%,#c89b69,#805332 80%);padding: max(12px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}.heading{display:flex;align-items:center;justify-content:center;gap:16px;color:#fff0ce;text-align:center;padding:7px 0 17px}.heading h1{font-weight:400;letter-spacing:.075em;font-size:clamp(22px,4vw,48px);margin:0;text-shadow:0 2px 3px #3d2319}.round{border:1px solid #bd956b;border-radius:50%;background:#f7e8c9;color:#714626;width:48px;height:48px;flex-shrink:0}.shelf{max-width:1250px;margin:auto;position:relative;border:12px ridge #9c6a40;border-radius:13px;background:linear-gradient(90deg,#5c351e,#9d6b3c 8%,#734626 94%,#4c2b1a);box-shadow:0 14px 28px #321c10a0;padding:18px 14px 22px}.shelf:after{content:'';display:block;height:21px;background:linear-gradient(#c08a55,#754324 50%,#442a1b);margin:16px -14px -22px}.bookgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,30px)}.book{border:0;background:transparent;min-width:0;color:#fff1d2}.book img{width:100%;height:clamp(170px,28vw,360px);object-fit:cover;object-position:center;border:5px ridge #d6b67f;border-radius:5px;box-shadow:5px 6px 8px #281a12b0}.book strong{display:block;font-size:clamp(14px,2vw,24px);background:#f8e5bc;color:#603d29;border:1px solid #b5884e;border-radius:8px;padding:7px 4px;margin-top:8px}.book small{display:block;margin:6px;color:#f5e1b8}.intro{text-align:center;color:#f7e9cb;margin:22px 0 5px;font-size:15px}.back{background:#f4e3bd;border:1px solid #a77a48;border-radius:30px;padding:10px 16px;color:#60432d}.readerbar{max-width:1260px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff0d2}.readerbar .name{text-align:center;font-size:clamp(17px,2.5vw,26px)}.readerbar small{display:block;font-size:14px;opacity:.85}.spread{max-width:1270px;min-height:min(690px,75vh);margin:auto;display:grid;grid-template-columns:1fr 1fr;border:14px solid #6f4129;border-radius:30px 30px 20px 20px;box-shadow:0 10px 26px #301c11aa,inset 0 0 0 3px #d6ad78;background:#f7e7c8;overflow:hidden}.page{min-width:0;position:relative;padding:clamp(15px,3vw,40px);background:radial-gradient(ellipse,#fff7e7 45%,#ead0a5 100%)}.page:first-child{border-right:4px solid #d7ba90;box-shadow:inset -9px 0 12px #8a5c3633}.page:last-child{background:radial-gradient(ellipse,#fff5e0 45%,#ead0a5 100%)}.textpanel{min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}.sentence{font-size:clamp(28px,3.5vw,49px);line-height:1.55;text-align:center;max-width:100%;overflow-wrap:break-word}.word{border-radius:5px;padding:1px 2px}.word.active{background:#c9d5b3;border-bottom:4px solid #70908c}.word.past{background:#e5e9d7}.track{width:90%;accent-color:#8c6745;touch-action:pan-y}.hint{font-size:14px;color:#866a51}.tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.tool{border:1px solid #bca27c;background:#f6e8cc;border-radius:25px;padding:9px 14px;color:#644630}.picture{min-height:350px;display:flex;flex-direction:column;align-items:center;justify-content:center}.picture img{max-width:100%;width:100%;height:min(440px,48vh);object-fit:contain;filter:drop-shadow(0 5px 3px #8c674522)}.picture .note{text-align:center;font-size:clamp(15px,1.7vw,20px);margin:12px 0;max-width:380px}.picture .coverart{width:min(85%,400px);height:min(400px,43vh);object-fit:cover;border:8px solid #f2dfb7;box-shadow:0 2px 12px #7d4e3044}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1260px;margin:15px auto}.nav button{background:#f3e0b9;border:1px solid #a77a48;color:#5c3d24;padding:13px 20px;border-radius:28px;min-width:110px}.nav button:disabled{opacity:.4}.footnote{text-align:center;color:#f3ddbb;font-size:13px;max-width:1000px;margin:16px auto}.parent{max-width:850px;margin:20px auto;background:#fff2d6;padding:25px;border-radius:14px;line-height:1.6}.parent h2{margin-top:0}.parent article{padding:12px;border-top:1px solid #d4b68c}@media(max-width:700px){.app{padding-left:8px;padding-right:8px}.shelf{border-width:7px;padding:8px}.bookgrid{gap:5px}.book img{border-width:2px;height:clamp(125px,40vw,230px)}.book strong{font-size:12px;padding:5px 2px}.book small{font-size:10px}.spread{grid-template-columns:1fr;border-width:8px;min-height:0}.page:first-child{border-right:0;border-bottom:3px solid #d7ba90}.textpanel{min-height:270px;gap:12px}.picture{min-height:290px}.picture img,.picture .coverart{height:260px}.sentence{font-size:clamp(28px,7vw,43px)}.page{padding:14px}.heading h1{font-size:22px}.round{width:39px;height:39px}.nav button{min-width:90px;padding:11px}.readerbar .name{font-size:16px}}

/* Illustrated cover: original approved watercolor artwork is the actual shelf, not a gradient approximation. */
.illustrated-shelf{position:relative;width:min(100%,1536px);aspect-ratio:1536/1024;margin:0 auto;background:url("shelf.webp") center/100% 100% no-repeat}
.shelf-hotspots{position:absolute;left:19.2%;right:18.3%;top:19%;bottom:7%;display:grid;grid-template-columns:repeat(3,1fr);gap:3%}
.shelf-hotspot{border:0;background:transparent;cursor:pointer;border-radius:9px;touch-action:manipulation}
.shelf-hotspot:focus-visible{outline:4px solid #fff2c5;outline-offset:2px}
.shelf-settings{position:absolute;right:1%;top:2%;width:7%;height:19%;border:0;background:transparent;color:transparent;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{background:#805537;padding:0 0 max(18px,env(safe-area-inset-bottom))}
#library{background:#805537}
#library .intro{margin:0;padding:12px 8px 20px;background:#805537}
@media(max-width:700px){.illustrated-shelf{min-height:0}.shelf-hotspots{top:20%;bottom:7%}}
.readerbar{background:linear-gradient(90deg,#744629,#a47546,#744629);border:2px solid #ba895b;border-radius:18px;padding:12px}.readerbar .name{font-size:clamp(23px,3vw,39px);color:#fff1d4}.spread{border-color:#754628}.picture .note{display:none}.picture img{border:0!important;box-shadow:none!important;object-fit:contain!important}.illustrated-shelf{max-width:1536px}.intro{display:none}
/* Reader refinement: keep title visible and a decorative, book-like spread. */
#reader{padding:12px 12px 26px;background:linear-gradient(110deg,#7b4b2e,#986641 48%,#75442b)}
#reader .readerbar{position:relative;min-height:112px;padding:16px 20px;margin-bottom:14px;border-radius:12px;background:linear-gradient(90deg,#69412c,#875738,#69412c)}
#reader .readerbar .name{font-size:clamp(24px,3vw,42px);line-height:1.18;flex:1}
#reader .readerbar small{font-size:clamp(14px,1.6vw,21px);margin-top:5px}
#reader .spread{border:12px solid #71412b;box-shadow:0 7px 0 #4d2c20,0 15px 22px #3b2117a0;min-height:clamp(520px,66vh,750px)}
#reader .page{background:radial-gradient(ellipse at 50% 43%,#fff9e9 42%,#f2dbb6 100%)}
#reader .page:last-child{background:radial-gradient(ellipse at 50% 43%,#fff7e5 42%,#eed3a7 100%)}
#reader .picture{min-height:430px}
#reader .picture img{height:min(520px,58vh);object-fit:contain}
#reader .picture .note{display:block;color:#74583d}
#reader .nav button{font-size:clamp(17px,2vw,24px)}
@media(min-width:701px){#reader .spread{grid-template-columns:1fr 1fr}#reader .textpanel{min-height:510px}}
@media(max-width:700px){#reader{padding:8px}#reader .readerbar{min-height:85px;padding:8px 6px;gap:4px}#reader .readerbar .name{font-size:clamp(16px,4vw,23px)}#reader .readerbar small{font-size:13px}#reader .readerbar .back{font-size:12px;padding:8px}#reader .readerbar .round{width:35px;height:35px}#reader .spread{border-width:7px;min-height:0}#reader .picture{min-height:270px}#reader .picture img{height:260px}#reader .textpanel{min-height:250px}}
</style></head><body><main class="app"><section id="library"><div class="illustrated-shelf"><div class="shelf-hotspots" id="books"></div><button class="shelf-settings" aria-label="Grownups reading notes" onclick="showParent()">⚙</button></div></section><section id="reader" class="hidden"><div class="readerbar"><button class="back" onclick="showLibrary()">‹ Bookshelf</button><div class="name"><span id="readerTitle"></span><small id="pageCount"></small></div><button class="round" aria-label="Grownups notes" onclick="showParent()">⚙</button></div><div class="spread"><div class="page"><div class="textpanel"><div class="sentence" id="sentence"></div><input id="track" class="track" aria-label="Slide to read each word" type="range" min="0" max="100" value="0" oninput="moveTrack(this.value)"><div class="hint">Slide to read →</div><div class="tools"><button class="tool" onclick="toggleSize()">A+ Larger text</button><button class="tool" onclick="resetTrack()">↺ Start again</button><button class="tool" onclick="speakPage()">🔊 Read aloud</button></div></div></div><div class="page"><div class="picture" id="artpage"></div><div class="tools"><button class="tool" id="reveal" onclick="toggleArt()">✿ Reveal picture</button></div></div></div><div class="nav"><button id="prev" onclick="turn(-1)">‹ Previous</button><button id="next" onclick="turn(1)">Next ›</button></div></section><section id="parent" class="parent hidden"><button class="back" onclick="backFromParent()">‹ Back</button><h2>Grownups' Reading Notes</h2><p>Original decodable practice stories. Some words may require parent assistance. The bookshelf is approved. The reading-page artwork is provisional while the eight individually illustrated scenes are being finalized.</p><div id="parentBooks"></div></section></main><script>
let BOOKS=[],current=null,page=0,large=false,revealed=false,origin='library';const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const art={kit:'kit-cover.webp',pip:'pip-cover.webp',sam:'sam-cover.webp'};
function renderShelf(){const positions=['kit','pip','sam'];$('books').innerHTML=positions.map(id=>{let b=BOOKS.find(x=>x.id===id);return b?`<button class="shelf-hotspot" aria-label="Read ${escapeHTML(b.title)}" onclick="openBook('${id}')"><span class="sr-only">${escapeHTML(b.title)}</span></button>`:''}).join('')}
function showLibrary(){current=null;$('library').classList.remove('hidden');$('reader').classList.add('hidden');$('parent').classList.add('hidden');renderShelf();scrollTo(0,0)}
function openBook(id){current=BOOKS.find(b=>b.id===id);page=0;large=false;$('library').classList.add('hidden');$('parent').classList.add('hidden');$('reader').classList.remove('hidden');renderPage();scrollTo(0,0)}
function renderPage(){revealed=false;$('readerTitle').textContent=current.title;$('pageCount').textContent=`Page ${page+1} of ${current.pages.length}`;const words=current.pages[page].split(/\s+/);$('sentence').innerHTML=words.map((w,i)=>`<span class="word" data-i="${i}">${escapeHTML(w)}</span>`).join(' ');$('sentence').style.fontSize=large?'clamp(36px,5vw,56px)':'';resetTrack();renderArt();$('prev').disabled=page===0;$('next').textContent=page===current.pages.length-1?'Finish ✓':'Next ›'}
function moveTrack(v){let spans=[...document.querySelectorAll('.word')],i=Math.min(spans.length-1,Math.floor(Number(v)/101*spans.length));spans.forEach((s,j)=>s.className='word '+(j===i?'active':j<i?'past':''))}
function resetTrack(){$('track').value=0;moveTrack(0)}
function toggleSize(){large=!large;$('sentence').style.fontSize=large?'clamp(36px,5vw,56px)':''}
function renderArt(){const src=current.id==='kit'?(page===0?'kit-art.webp':`kit-page-${page+1}.webp`):art[current.id];$('artpage').innerHTML=revealed?`<img class="${current.id==='kit'?'':'coverart'}" src="${src}" alt="Illustration for ${escapeHTML(current.title)}"><div class="note">${escapeHTML(current.pages[page])}</div>`:'<div class="note">✿<p>Read the words first.<br>Then reveal the picture.</p></div>';$('reveal').textContent=revealed?'◉ Hide picture':'✿ Reveal picture'}
function toggleArt(){revealed=!revealed;renderArt()}
function speakPage(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(current.pages[page]);u.rate=.8;speechSynthesis.speak(u)}
function turn(delta){if(page===current.pages.length-1&&delta===1){localStorage.setItem('read-'+current.id,'yes');showLibrary();return}page=Math.max(0,Math.min(current.pages.length-1,page+delta));renderPage();scrollTo(0,0)}
function showParent(){origin=current?'reader':'library';$('library').classList.add('hidden');$('reader').classList.add('hidden');$('parent').classList.remove('hidden');$('parentBooks').innerHTML=BOOKS.map(b=>`<article><h3>${escapeHTML(b.title)}</h3><small>${escapeHTML(b.level)}</small><ol>${b.pages.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol></article>`).join('');scrollTo(0,0)}
function backFromParent(){if(origin==='reader'&&current){$('parent').classList.add('hidden');$('reader').classList.remove('hidden')}else showLibrary()}
fetch('./books.json?v=6').then(r=>{if(!r.ok)throw Error('Failed to load books');return r.json()}).then(data=>{BOOKS=data;renderShelf()}).catch(e=>{$('books').textContent='Could not load the books. Please refresh. '+e.message});
</script></body></html>
