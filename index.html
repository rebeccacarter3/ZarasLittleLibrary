</style><script id="zara-family-bridge">
window.ZaraFamily=(()=>{
 const PROFILE='zara-reader-v4',HISTORY='zara-readings-v4',CODE='zara-family-invite-v1';
 let code=null, family=null, readers=[],ready=false;
 const get=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}};
 const portraits={kit:'assets/kit-companion.PNG',sara:'assets/sara-companion.PNG',sam:'assets/sam-companion.PNG'};
 const path=location.pathname.match(/^\/invite\/([A-Za-z0-9_-]+)\/?$/);
 if(path){code=path[1];localStorage.setItem(CODE,code);}else code=localStorage.getItem(CODE);
 // Give each family its own installable web-app identity and launch URL.
 // iOS standalone storage may be separate from Safari storage.
 if(code){
  const manifest=document.querySelector('link[rel="manifest"]');
  if(manifest)manifest.href='/api/families/'+encodeURIComponent(code)+'/manifest.webmanifest';
 }
 const base=()=>'/api/families/'+encodeURIComponent(code);
 async function api(route='',method='GET',body){const response=await fetch(base()+route,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!response.ok)throw new Error((await response.json().catch(()=>({}))).error||'Unable to save');return response.json()}
 const current=()=>get(PROFILE,null);
 function storeProfile(r){const p={id:r.ReaderID,name:r.DisplayName,companion:r.CompanionID,issued:r.CreatedAt};localStorage.setItem(PROFILE,JSON.stringify(p));localStorage.setItem('zara-family-active-'+code,r.ReaderID);return p}
 function selected(){const id=localStorage.getItem('zara-family-active-'+code);return readers.find(r=>r.ReaderID===id)||null}
 async function refresh(){
  const previous=get(HISTORY,[]);
  const [r,h]=await Promise.all([api('/readers'),api('/history')]);
  readers=r.readers||[];family=r.family;
  const entries=(h.history||[]).map(x=>({id:x.ReadingID,readerId:x.ReaderID,name:readers.find(r=>r.ReaderID===x.ReaderID)?.DisplayName||'',bookId:x.BookID,date:x.CompletedAt}));
  const key='zara-family-pending-'+code;
  const pending=get(key,[]);
  const ids=new Set(entries.map(x=>x.id));
  const familyIds=new Set(readers.map(x=>x.ReaderID));
  // Preserve and queue old local readings for readers that belong to this family.
  const recover=previous.filter(x=>x&&x.id&&familyIds.has(x.readerId)&&!ids.has(x.id));
  const queue=new Map([...pending,...recover].filter(x=>x&&x.id&&familyIds.has(x.readerId)).map(x=>[x.id,x]));
  localStorage.setItem(key,JSON.stringify([...queue.values()]));
  const merged=new Map([...entries,...queue.values()].map(x=>[x.id,x]));
  localStorage.setItem(HISTORY,JSON.stringify([...merged.values()].sort((a,b)=>String(a.date).localeCompare(String(b.date)))));
  const p=selected();if(p)storeProfile(p);else localStorage.removeItem(PROFILE);
  return readers;
 }
 async function init(){if(!code)return;try{await refresh();ready=true;await flush();if(!get('zara-family-pending-'+code,[]).length)await refresh();}catch(e){console.warn('Family library is temporarily unavailable',e)}}
 async function saveProfile(p,wasEditing){if(!code)return;const data={readerId:p.id,displayName:p.name,companionId:p.companion};const result=await api('/readers',wasEditing?'PATCH':'POST',data);if(wasEditing){await refresh();return}readers.push(result.reader);storeProfile(result.reader);}
 async function saveReading(entry){if(!code)return;const key='zara-family-pending-'+code;let pending=get(key,[]);if(!pending.some(x=>x.id===entry.id))pending.push(entry);localStorage.setItem(key,JSON.stringify(pending));await flush()}
 let flushing=null;
 async function flush(){
  if(!code)return;
  if(flushing)return flushing;
  flushing=(async()=>{
   const key='zara-family-pending-'+code;
   const pending=get(key,[]),unsent=[];
   for(const x of pending){
    try{await api('/history','POST',{readingId:x.id,readerId:x.readerId,bookId:x.bookId,completedAt:x.date})}
    catch(e){unsent.push(x);console.warn('Reading will sync later',e)}
   }
   // Preserve entries added while this batch was in flight.
   const current=get(key,[]);
   const attempted=new Set(pending.map(x=>x.id));
   const merged=new Map([...unsent,...current.filter(x=>!attempted.has(x.id))].map(x=>[x.id,x]));
   localStorage.setItem(key,JSON.stringify([...merged.values()]));
  })();
  try{await flushing}finally{flushing=null}
 }
 function choose(){const layer=document.querySelector('.z4-layer');if(!layer||!code||!ready)return false;layer.hidden=false;layer.replaceChildren();const panel=document.createElement('section');panel.className='z4-paper';const title=document.createElement('h2');title.textContent='Whose adventure is beginning?';panel.append(title);const subtitle=document.createElement('p');subtitle.textContent='Choose a library card for '+(family?.FamilyName||'your family')+'.';panel.append(subtitle);const grid=document.createElement('div');grid.className='zf-choice-list';for(const r of readers){const b=document.createElement('button');b.className='zf-choice';const img=document.createElement('img');img.src=portraits[r.CompanionID]||portraits.sara;img.alt='';const name=document.createElement('strong');name.textContent=r.DisplayName;b.append(img,name);b.onclick=()=>{storeProfile(r);window.zaraShowLibraryCard?.()};grid.append(b)}panel.append(grid);const add=document.createElement('button');add.className='z4-action';add.textContent='＋ Create a library card';add.onclick=()=>{localStorage.removeItem(PROFILE);window.zaraShowLibraryCard?.()};panel.append(add);const close=document.createElement('button');close.className='z4-action secondary';close.textContent='Explore the library';close.onclick=()=>{layer.hidden=true;layer.replaceChildren()};panel.append(close);layer.append(panel);return true}
 async function open(){if(code){if(!ready)await init();if(!ready){alert('Could not load family library cards. Please try again.');return false}if(readers.length)return choose()}window.zaraShowLibraryCard?.();return true}
 document.addEventListener('DOMContentLoaded',()=>{init();document.addEventListener('visibilitychange',()=>{if(!document.hidden)flush()})});
 return {get code(){return code},get ready(){return ready},get readers(){return readers},saveProfile,saveReading,choose,open,refresh,init};
})();

@keyframes z5Peek{0%{opacity:0;transform:translateY(90px) rotate(15deg)}25%,70%{opacity:1;transform:translateY(0) rotate(-5deg)}100%{opacity:0;transform:translateY(80px)}}

@keyframes z5Cheer{0%,100%{transform:translateY(0) rotate(-5deg)}40%{transform:translateY(-14px) rotate(7deg)}}
.z5-checkout-stamp{margin:10px auto 18px;display:block;width:max-content;max-width:90%;border:4px double #a3483d;border-radius:8px;color:#a3483d;padding:9px 14px;font:bold clamp(14px,3vw,21px) Georgia,serif;letter-spacing:.06em;transform:rotate(-8deg);animation:z5StampDown .85s .3s cubic-bezier(.18,1.4,.35,1) both}
@keyframes z5StampDown{0%{opacity:0;transform:translateY(-150px) scale(2) rotate(-15deg)}60%{opacity:1;transform:translateY(5px) scale(.88) rotate(-8deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(-8deg)}}
.z5-greeting{position:absolute;top:12%;left:26%;width:45%;text-align:center;color:#fff5d5;text-shadow:0 2px 9px #3b2a17,0 0 13px #ffe29a;font:bold clamp(11px,2.2vw,28px) Georgia,serif;z-index:13;pointer-events:none;animation:z5Greeting 3s ease both}
@keyframes z5Greeting{0%,100%{opacity:0}15%,75%{opacity:1}}
@media(prefers-reduced-motion:reduce){.z5-peek,.z5-celebrate,.z5-checkout-stamp,.z5-butterfly,.z5-greeting{animation:none!important}}

/* V5.1: approved illustrated card background and non-overlapping reader companion. */

@media(max-width:480px){.z4-card{padding-top:15%!important;padding-bottom:15%!important}}
</style><script id="zara-v5-script">
(function(){
'use strict';
const KEY='zara-reader-v4',HISTORY='zara-readings-v4';
const portraits={kit:'assets/kit-companion.PNG',sara:'assets/sara-companion.PNG',sam:'assets/sam-companion.PNG'};
const roles={kit:'The Curious Explorer',sara:'The Gentle Helper',sam:'The Brave Adventurer'};
const profile=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}};
const historyRead=()=>{try{return JSON.parse(localStorage.getItem(HISTORY))||[]}catch{return []}};
function sound(id){try{const a=animalAudio[id];if(a){a.pause();a.currentTime=0;a.play().catch(()=>{})}}catch(e){}}
function spark(host,n=16){for(let i=0;i<n;i++){const x=document.createElement('span');x.className='z4-spark';x.textContent=i%2?'✦':'✧';x.style.left=(5+(i*43)%87)+'%';x.style.top=(15+(i*19)%70)+'%';x.style.animationDelay=(i%8*.11)+'s';host.appendChild(x);setTimeout(()=>x.remove(),2100)}}
function decorateCard(){document.querySelectorAll('.z4-card').forEach(c=>{
  if(c.dataset.illustrated==='yes')return;
  c.dataset.illustrated='yes';
  // The watercolor asset includes the official header, butterfly, flowers, and borders.
  // The live name, portrait, role and member-since date remain selectable HTML text.
  const kicker=c.querySelector('.z4-kicker');if(kicker)kicker.classList.add('z6-hide-kicker');
  spark(c,10);
})}
// Replace V4's cropped CSS portraits with original transparent watercolor PNGs.
const oldLayer=document.querySelector('.z4-layer');
const observer=new MutationObserver(()=>{document.querySelectorAll('.z4-avatar').forEach(el=>{const id=['kit','sara','sam'].find(x=>el.classList.contains(x));if(!id||el.querySelector('img'))return;const img=document.createElement('img');img.src=portraits[id];img.alt=id.charAt(0).toUpperCase()+id.slice(1)+' watercolor portrait';el.append(img)});decorateCard()});
observer.observe(oldLayer,{subtree:true,childList:true});
const room=document.getElementById('home');
// V4 has an invisible card hotspot; make the holder visibly antique brass.
const oldHolder=room.querySelector('.z4-reader-card');if(oldHolder)oldHolder.remove();
// Always expose My Library Card in the existing lighting settings.
document.querySelectorAll('.magic-panel').forEach(panel=>{if(panel.querySelector('.z5-settings-card'))return;const btn=document.createElement('button');btn.className='z5-settings-card';btn.textContent='✉ My Library Card';btn.onclick=()=>{panel.classList.add('hide');window.ZaraFamily?.open()};panel.append(btn)});
// Nonintrusive companion icon during reading.
const reader=document.getElementById('reader');const icon=document.createElement('button');icon.className='z5-companion-reader';icon.hidden=true;icon.setAttribute('aria-label','Hear your reading companion');icon.onclick=()=>{const p=profile();if(p)sound(p.companion)};reader.append(icon);
function updateIcon(){const p=profile();icon.hidden=!p;if(p){icon.replaceChildren();const img=document.createElement('img');img.src=portraits[p.companion]||portraits.sara;img.alt=p.companion+' companion';icon.append(img)}}
function peek(){const p=profile();if(!p)return;const im=document.createElement('img');im.className='z5-peek';im.src=portraits[p.companion];im.alt='';document.body.append(im);setTimeout(()=>im.remove(),2400)}
const origOpen=window.openBook;window.openBook=function(id){origOpen(id);updateIcon();peek()};
// selectWithTransition calls lexical openBook, not window.openBook: also observe reader visibility.
new MutationObserver(()=>{if(!reader.classList.contains('hide')){updateIcon();if(!reader.dataset.z5Peeked){reader.dataset.z5Peeked='yes';peek()}}else{delete reader.dataset.z5Peeked}}).observe(reader,{attributes:true,attributeFilter:['class']});
const origCard=window.zaraShowLibraryCard;window.zaraShowLibraryCard=function(){origCard();setTimeout(decorateCard,0)};
// Returning readers receive a greeting and their companion's welcome chirp/meow/squeak.
let wasEntrance=true;new MutationObserver(()=>{const entered=!room.classList.contains('hide')&&reader.classList.contains('hide');if(entered&&wasEntrance){wasEntrance=false;const p=profile();if(p){const hello=document.createElement('div');hello.className='z5-greeting';hello.textContent='Welcome back, '+p.name+'! ✨';room.append(hello);setTimeout(()=>hello.remove(),3200);sound(p.companion)}}if(!entered&&document.getElementById('entrance').classList.contains('hide')===false)wasEntrance=true}).observe(room,{attributes:true,attributeFilter:['class']});
// Correct completion: only when Next is clicked WHILE already on the final page.
// Capture before the V4 handler runs; stop the old The End overlay from appearing behind the sheet.
const next=document.getElementById('next');let completionOpen=false,recordedForVisit=false,sessionBook=null;
function sheet(){if(!book||completionOpen)return;completionOpen=true;const b=book,p=profile(),layer=oldLayer;
 if(!p){window.zaraShowLibraryCard?.();completionOpen=false;return}
 layer.hidden=false;layer.replaceChildren();const paper=document.createElement('section');paper.className='z4-paper';layer.append(paper);
 const title=document.createElement('h2');title.textContent='A Story for the Record! 📖';paper.append(title);
 const intro=document.createElement('p');intro.textContent='You finished '+b.title+'!';paper.append(intro);
 const img=document.createElement('img');img.className='z5-celebrate';img.src=portraits[p.companion];img.alt=p.companion+' celebrating';paper.append(img);
 const message=document.createElement('p');message.textContent=p.companion.charAt(0).toUpperCase()+p.companion.slice(1)+' is so proud of you, '+p.name+'!';paper.append(message);
 const record=document.createElement('div');record.className='z4-record';record.innerHTML='<h3>Library Checkout Card</h3>';const table=document.createElement('table');const head=document.createElement('tr');for(const t of ['Little reader','Date read']){const th=document.createElement('th');th.textContent=t;head.append(th)}table.append(head);
 const h=historyRead();
 if(!recordedForVisit||sessionBook!==b.id){const entry={id:crypto.randomUUID(),readerId:p.id,name:p.name,bookId:b.id,date:new Date().toISOString()};h.push(entry);localStorage.setItem(HISTORY,JSON.stringify(h));window.ZaraFamily?.saveReading(entry).catch(e=>console.warn('Reading sync pending',e));recordedForVisit=true;sessionBook=b.id}
 for(const entry of h.filter(x=>x.bookId===b.id).slice(-7)){const tr=document.createElement('tr');for(const v of [entry.name,new Date(entry.date).toLocaleDateString()]){const td=document.createElement('td');td.textContent=v;tr.append(td)}table.append(tr)}record.append(table);paper.append(record);
 const stamp=document.createElement('div');stamp.className='z5-checkout-stamp';stamp.textContent='STORY COMPLETED';paper.append(stamp);spark(paper,22);
 const actions=document.createElement('div');const backShelf=document.createElement('button');backShelf.className='z4-action';backShelf.textContent='‹ Back to Bookshelf';backShelf.onclick=()=>{layer.hidden=true;layer.replaceChildren();completionOpen=false;document.getElementById('back').click()};const backBook=document.createElement('button');backBook.className='z4-action secondary';backBook.textContent='Back to Book';backBook.onclick=()=>{layer.hidden=true;layer.replaceChildren();completionOpen=false};actions.append(backShelf,backBook);paper.append(actions);
 setTimeout(()=>{sound(p.companion)},400);
 }
 // Disable the legacy end animation only on the finish action, while preserving it elsewhere.
 next.addEventListener('click',e=>{if(!book)return;if(page===book.pages.length-1){e.stopImmediatePropagation();e.preventDefault();sheet()}},true);
 // On a new book, allow one new reading record, including rereads after reopening the book.
 document.querySelectorAll('[data-book]').forEach(el=>el.addEventListener('click',()=>{recordedForVisit=false;sessionBook=null},true));
 const restart=document.getElementById('restart');restart.addEventListener('click',()=>{recordedForVisit=false;sessionBook=null});
 // If the last page is reached, label the button as the explicit finish action.
 const change=new MutationObserver(()=>{if(book&&page===book.pages.length-1&&next.textContent!=='Finish Story ✨')next.textContent='Finish Story ✨'});change.observe(document.getElementById('count'),{childList:true,characterData:true,subtree:true});
})();
</script></body></html>
